name: bootstrap-platform

# Manual only. Generates the Android and iOS project folders on a runner (no local SDK exists)
# and pushes them to the scaffold-output branch so they can be reviewed and copied into app/.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          dart --version

      - name: Generate platform projects
        run: |
          mkdir -p "$RUNNER_TEMP/scaffold"
          cd "$RUNNER_TEMP/scaffold"
          flutter create --org com.zdmgold --project-name tehillah --platforms=android,ios --template=app app
          rm -rf app/.dart_tool app/build
          echo "Generated files:"
          find app -type f | sort | head -200

      - name: Publish to scaffold-output branch
        run: |
          set -eu
          cd "$RUNNER_TEMP/scaffold/app"
          git init -q -b scaffold-output
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "scaffold: flutter create output for com.zdmgold.tehillah"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin scaffold-output

      - uses: actions/upload-artifact@v4
        with:
          name: tehillah-platform-scaffold
          path: ${{ runner.temp }}/scaffold/app
          retention-days: 7
